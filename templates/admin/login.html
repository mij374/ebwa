<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin login — EBWA</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css', v=asset_version('css/style.css')) }}">
{% include "_icons.html" %}
</head>
<body class="login-body">
  <form class="login-card" method="post">
    <span class="brand-mark" style="margin:0 auto 16px"><img src="{{ url_for('static', filename='img/ebwa-logo.png') }}" alt="EBWA logo"></span>
    <h1>EBWA Admin</h1>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in messages %}
      <div class="flash flash-{{ cat }}">{{ msg }}</div>
      {% endfor %}
    {% endwith %}
    <label>Email
      <input type="email" name="email" required autofocus autocomplete="username">
    </label>
    <label>Password
      <input type="password" name="password" required autocomplete="current-password">
    </label>
    <button class="btn btn-green" type="submit" style="width:100%;justify-content:center">Log in</button>
    <a class="login-back" href="{{ url_for('home') }}">← Back to website</a>
  </form>
</body>
</html>
