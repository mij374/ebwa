{% extends "admin/base_admin.html" %}
{% block content %}
<h1 class="admin-h1">Gallery</h1>
<p class="admin-sub">Upload photos to the public gallery. You can select several at once.</p>

<form method="post" enctype="multipart/form-data" class="admin-form" style="margin-bottom:40px">
  <div class="field">
    <label for="images">Add photos</label>
    <input type="file" id="images" name="images" accept="image/*" multiple required>
  </div>
  <div class="field">
    <label for="caption">Caption (optional, applied to this upload)</label>
    <input type="text" id="caption" name="caption" placeholder="e.g. Eid celebration 2026">
  </div>
  <button class="btn btn-green" type="submit">Upload</button>
</form>

{% if images %}
<div class="admin-gallery-grid">
  {% for img in images %}
  <div class="admin-gallery-item">
    <img src="{{ url_for('static', filename='uploads/' + img.filename) }}" alt="">
    {% if img.caption %}<span>{{ img.caption }}</span>{% endif %}
    <form method="post" action="{{ url_for('admin_gallery_delete', image_id=img.id) }}"
          onsubmit="return confirm('Delete this photo?');">
      <button class="table-link danger" type="submit">Delete</button>
    </form>
  </div>
  {% endfor %}
</div>
{% endif %}
{% endblock %}
