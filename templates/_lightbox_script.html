<script>
(function () {
  // EVERY container that opts in, not one grid by id: the gallery has a
  // single masonry, Our Journey has one per milestone, and both want the
  // same viewer over the same set of links. Document order, so Previous
  // and Next walk the page the way the reader would.
  var box = document.getElementById('lightbox');
  var links = [].slice.call(
    document.querySelectorAll('.js-lightbox a[href]'));
  if (!box || !links.length) { return; }
  var image = document.getElementById('lightboxImage');
  var caption = document.getElementById('lightboxCaption');
  var count = document.getElementById('lightboxCount');
  var current = 0;
  var opener = null;

  function show(index) {
    if (index < 0) { index = links.length - 1; }
    if (index >= links.length) { index = 0; }
    current = index;
    var link = links[index];
    var text = link.getAttribute('data-caption') || '';
    image.setAttribute('src', link.getAttribute('href'));
    image.setAttribute('alt', text || 'EBWA community photo');
    caption.textContent = text;
    caption.hidden = !text;
    count.textContent = (index + 1) + ' of ' + links.length;
  }

  function open(index, trigger) {
    opener = trigger || null;
    show(index);
    box.hidden = false;
    document.body.classList.add('lightbox-open');
    document.getElementById('lightboxClose').focus();
  }

  function close() {
    box.hidden = true;
    document.body.classList.remove('lightbox-open');
    image.removeAttribute('src');      // never src="" — see the markup
    if (opener) { opener.focus(); }
  }

  links.forEach(function (link, i) {
    link.addEventListener('click', function (event) {
      if (event.metaKey || event.ctrlKey || event.shiftKey) { return; }
      event.preventDefault();
      open(i, link);
    });
  });

  document.getElementById('lightboxClose').addEventListener('click', close);
  document.getElementById('lightboxPrev').addEventListener('click', function () {
    show(current - 1);
  });
  document.getElementById('lightboxNext').addEventListener('click', function () {
    show(current + 1);
  });
  // Anything that is not the photograph or a control closes it. The old
  // rule was "did the click land on the backdrop ELEMENT", which missed
  // every part of the overlay covered by the figure: the gap under a
  // wide photo, the space either side of a tall one, and the caption —
  // all of which look like backdrop and were dead to the click.
  var KEEPS_OPEN = '#lightboxImage, .lightbox-nav, .lightbox-close';
  box.addEventListener('click', function (event) {
    var target = event.target;
    if (target && target.closest && target.closest(KEEPS_OPEN)) { return; }
    close();
  });

  document.addEventListener('keydown', function (event) {
    if (box.hidden) { return; }
    if (event.key === 'Escape') { close(); }
    else if (event.key === 'ArrowLeft') { show(current - 1); }
    else if (event.key === 'ArrowRight') { show(current + 1); }
    else if (event.key === 'Tab') {
      // Keep tabbing inside the dialog while it is open.
      var stops = box.querySelectorAll('button');
      var first = stops[0];
      var last = stops[stops.length - 1];
      if (event.shiftKey && document.activeElement === first) {
        event.preventDefault();
        last.focus();
      } else if (!event.shiftKey && document.activeElement === last) {
        event.preventDefault();
        first.focus();
      }
    }
  });

  // Swipe, with a deliberately generous threshold so a scroll or a tap
  // is never mistaken for one.
  var startX = 0, startY = 0, tracking = false;
  box.addEventListener('touchstart', function (event) {
    if (event.touches.length !== 1) { tracking = false; return; }
    startX = event.touches[0].clientX;
    startY = event.touches[0].clientY;
    tracking = true;
  }, { passive: true });
  box.addEventListener('touchend', function (event) {
    if (!tracking) { return; }
    tracking = false;
    var touch = event.changedTouches[0];
    var dx = touch.clientX - startX;
    var dy = touch.clientY - startY;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy)) {
      show(dx < 0 ? current + 1 : current - 1);
    }
  }, { passive: true });
})();
</script>
